
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noor-e-Deen</title>
<style>
body{margin:0;background:#effcf4;color:#173d32;font-family:Arial,sans-serif;text-align:center}
header{background:#075c48;color:white;padding:30px 12px;border-radius:0 0 30px 30px}
h1{font-size:34px}h2{font-size:24px}
main{padding:16px;max-width:700px;margin:auto}
.card{background:white;border-radius:22px;padding:20px 12px;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{background:#08795d;color:white;border:0;border-radius:12px;padding:12px;font-size:16px;margin:5px}
button:active{opacity:.7}
#count{font-size:38px;margin:12px}
input{padding:10px;width:75px;margin:4px}
.item{padding:12px;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<header>
<h1>☪ Noor-e-Deen</h1>
<p>Namaz • Tasbeeh • Dua • Deen</p>
</header>
<main>
<section class="card">
<h2>🕌 Namaz aur Jamaat</h2>
<div id="times"></div>
<button onclick="editTimes()">Jamaat timing badlein</button>
</section>
<div class="grid">
<section class="card">
<h2>📿 Digital Tasbeeh</h2>
<div id="count">0</div>
<button onclick="count++ ; document.getElementById('count').textContent=count">+1</button>
<button onclick="count=0;document.getElementById('count').textContent=count">Reset</button>
</section>
<section class="card">
<h2>🤲 Dua aur Azkar</h2>
<button onclick="showDuas()">Dua dekhein</button>
</section>
<section class="card">
<h2>🧭 Qibla Direction</h2>
<button onclick="qibla()">Qibla kholein</button>
</section>
<section class="card">
<h2>🔔 Namaz Reminder</h2>
<button onclick="reminder()">Reminder</button>
</section>
<section class="card">
<h2>📅 Islamic Calendar</h2>
<button onclick="calendar()">Aaj ki tareekh</button>
</section>
<section class="card">
<h2>☪ Allah ke 99 naam</h2>
<button onclick="names()">Naam dekhein</button>
</section>
</div>
<section class="card" id="result">Assalamu Alaikum! Noor-e-Deen mein aapka swagat hai.</section>
</main>
<script>
let count=0;
let defaults={Fajr:"05:00",Zuhr:"13:15",Asr:"16:30",Maghrib:"18:00",Isha:"20:00"};
function loadTimes(){
try{let saved=JSON.parse(localStorage.getItem("jamaatTimes"));if(saved)defaults=saved}catch(e){}
document.getElementById("times").textContent=Object.entries(defaults).map(([k,v])=>k+" "+v).join(" · ");
}
function editTimes(){
let t={};
for(let k of Object.keys(defaults)){let v=prompt(k+" jamaat time (HH:MM)",defaults[k]);if(v===null)return;if(!/^\d{2}:\d{2}$/.test(v)){alert("Time HH:MM format mein likhein");return}t[k]=v}
defaults=t;localStorage.setItem("jamaatTimes",JSON.stringify(t));loadTimes();alert("Jamaat timings save ho gayi!");
}
function showDuas(){document.getElementById("result").innerHTML="<h2>Dua aur Azkar</h2><p>سُبْحَانَ اللَّهِ</p><p>SubhanAllah — Allah paak hai.</p><p>الْحَمْدُ لِلَّهِ</p><p>Alhamdulillah — Sab tareef Allah ke liye hai.</p><p>اللَّهُ أَكْبَرُ</p><p>Allahu Akbar — Allah sabse bada hai.</p><p>أَسْتَغْفِرُ اللَّهَ</p><p>Astaghfirullah — Main Allah se maghfirat maangta hoon.</p>"}
function qibla(){document.getElementById("result").innerHTML='<h2>🧭 Qibla Direction</h2><p>Qibla ke liye location aur compass ki zaroorat hai.</p><button onclick="navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{let lat=p.coords.latitude*Math.PI/180,lon=p.coords.longitude*Math.PI/180,kLat=21.4225*Math.PI/180,kLon=39.8262*Math.PI/180;let y=Math.sin(kLon-lon),x=Math.cos(lat)*Math.tan(kLat)-Math.sin(lat)*Math.cos(kLon-lon);let deg=(Math.atan2(y,x)*180/Math.PI+360)%360;document.getElementById(\'result\').innerHTML=\'<h2>Qibla</h2><p>Approx direction: \'+Math.round(deg)+\'° from North</p>\'},()=>alert(\'Location permission dein\')):alert(\'Location supported nahi hai\')">Location se direction nikalein</button>'}
function reminder(){if("Notification"in window){Notification.requestPermission().then(p=>alert(p==="granted"?"Permission mil gayi. Yeh demo reminder hai; background alarm abhi set nahi hai.":"Notification permission nahi mili."))}else alert("Is browser mein notifications available nahi hain.")}
function calendar(){let d=new Date();document.getElementById("result").innerHTML="<h2>📅 Aaj ki tareekh</h2><p>"+d.toLocaleDateString("hi-IN",{day:"numeric",month:"long",year:"numeric"})+"</p><p>Hijri tareekh ke liye device/browser ka Islamic calendar support chahiye.</p>"}
function names(){let n=["Ar-Rahman — Nihayat meherban","Ar-Raheem — Bahut raham karne wala","Al-Malik — Haqeeqi Badshah","Al-Quddus — Paak","As-Salam — Salamati dene wala","Al-Mu'min — Aman dene wala","Al-Aziz — Ghalib","Al-Jabbar — Zabardast","Al-Mutakabbir — Buzurgi wala","Al-Khaliq — Paida karne wala"];document.getElementById("result").innerHTML="<h2>Allah ke naam</h2>"+n.map((x,i)=>'<div class="item">'+(i+1)+". "+x+"</div>").join("")+"<p>Yeh pehle 10 naam hain.</p>"}
loadTimes();
</script>
</body>
</html>
